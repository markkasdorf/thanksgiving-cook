<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Thanksgiving cook day</title>
<meta name="theme-color" content="#f7f1e6">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦃</text></svg>">
<style>
:root{--bg:#f7f1e6;--card:#fffdf8;--ink:#2b2118;--soft:#6f6253;--line:#e6dccb;--now:#fff1c9;--accent:#a8481c}
*{box-sizing:border-box}html,body{overflow-x:hidden;max-width:100%}.nowline span:last-child{min-width:0}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{padding:20px 18px 8px;max-width:980px;margin:0 auto}
h1{font:700 30px/1.1 Georgia,"Times New Roman",serif;margin:0}
.sub{color:var(--soft);margin-top:6px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.units{display:inline-flex;background:#ece2d0;border-radius:999px;padding:3px}.units button{border:0;background:transparent;font:600 14px/1 inherit;padding:7px 13px;border-radius:999px;color:var(--soft);cursor:pointer}.units button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}.amt{font-weight:600}
.clock{font-variant-numeric:tabular-nums;font-weight:600;color:var(--accent)}
nav{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 18px;max-width:980px;margin:0 auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font:600 15px/1 inherit;cursor:pointer;text-decoration:none;white-space:nowrap}
.chip .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:1px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
main{max-width:980px;margin:0 auto;padding:14px 18px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0;box-shadow:0 1px 2px rgba(60,40,20,.05)}
.nowbox{background:var(--now);border-color:#efd98f}
.nowbox h2,.card h2{font:700 19px/1.2 Georgia,serif;margin:0 0 10px}
.nowline{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-top:1px dashed rgba(0,0,0,.1)}
.nowline:first-of-type{border-top:0}
.tag{font-size:12px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:#fff;border-radius:6px;padding:3px 7px;flex:none}
.who{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:24px;border-radius:12px;background:#efe6d6;color:var(--ink);font:700 12px/1 inherit;padding:0 8px;flex:none}
.grid{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:16px;border:1px solid var(--line);background:var(--card)}
table{border-collapse:separate;border-spacing:0;min-width:900px;width:100%;font-size:14px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
thead th{position:sticky;top:0;background:#fbf6ec;font-size:13px}
thead th a{color:inherit;text-decoration:none;border-bottom:3px solid;padding-bottom:2px}
tbody th{position:sticky;left:0;background:#fbf6ec;font-variant-numeric:tabular-nums;white-space:nowrap;z-index:1}
tr.cur td,tr.cur th{background:var(--now)}
td .it{margin-bottom:6px}td .it:last-child{margin-bottom:0}
td .t{font-weight:700;font-variant-numeric:tabular-nums}
td .p{color:var(--soft);font-size:12px;font-weight:600}
.hero{border-left:8px solid;padding-left:14px}
.hero h2{font:700 28px/1.1 Georgia,serif;margin:0}
.meta{color:var(--soft);margin-top:6px}
.goal{margin-top:10px;font-weight:600}.status{margin-top:10px;background:var(--now);border-radius:10px;padding:8px 10px}
ol.steps{list-style:none;margin:0;padding:0}
.step{display:grid;grid-template-columns:62px 1fr 44px;gap:12px;align-items:start;padding:14px 0;border-top:1px solid var(--line)}
.step:first-child{border-top:0}
.step .time{font:700 17px/1.2 inherit;font-variant-numeric:tabular-nums}
.step .txt{font-size:17px}
.step .whoname{font-size:13px;font-weight:700;color:var(--soft);margin-bottom:3px;text-transform:uppercase;letter-spacing:.03em}
.step.cur{background:var(--now);margin:0 -16px;padding:14px 16px;border-radius:12px}
.step.past:not(.done) .time{color:var(--accent)}
.step.done .txt,.step.done .time,.step.done .whoname{opacity:.4;text-decoration:line-through}
.box{width:40px;height:40px;border-radius:10px;border:2px solid #cbbda6;background:#fff;cursor:pointer;display:grid;place-items:center;font-size:22px;color:#fff;padding:0}
.step.done .box{background:#3f7d3a;border-color:#3f7d3a}
details{margin-top:4px}summary{cursor:pointer;font:700 19px/1.2 Georgia,serif;padding:2px 0;list-style:none}
summary::after{content:" ▾";color:var(--soft);font-size:15px}
details[open] summary::after{content:" ▴"}
ul.ing{margin:10px 0 0;padding-left:20px}ul.ing li{margin:4px 0}
.tips{color:var(--soft);font-size:15px}.tips p{margin:6px 0}
.who-filter{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 6px}
.who-filter .chip{padding:6px 11px;font-size:14px}
.tl .step{grid-template-columns:62px 1fr 44px}
.dishname{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin-bottom:3px}
.foot{color:var(--soft);font-size:13px;text-align:center;margin-top:28px}
@media (min-width:760px){h1{font-size:38px}.hero h2{font-size:34px}}
</style></head><body>
<header>
 <h1>Thanksgiving cook day</h1>
 <div class="sub"><span>Sit down at 3:00 · <span class="clock" id="clock"></span></span><span class="units" id="units"><button data-u="us">Cups</button><button data-u="metric">Grams</button></span></div>
</header>
<nav><div class="chips" id="nav"></div></nav>
<main id="main"></main>
<script src="data.js"></script>
<script>
const DAY="2026-11-26";
const $=s=>document.querySelector(s);
let units=localStorage.getItem("tg-units")||"us";
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])).replace(/\{\{([^|}]*)\|([^}]*)\}\}/g,(m,a,b)=>`<span class="amt">${units==="metric"?b:a}</span>`);
const fmt=t=>{let [h,m]=t.split(":").map(Number);const ap=h>=12?"pm":"am";h=h%12||12;return h+":"+String(m).padStart(2,"0")};
const mins=t=>{const [h,m]=t.split(":").map(Number);return h*60+m};
const nowMins=()=>{const d=new Date();const iso=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");return iso===DAY?d.getHours()*60+d.getMinutes():(location.hash.includes("demo")?600:null)};
const ticks=JSON.parse(localStorage.getItem("tg-ticks")||"{}");
const save=()=>localStorage.setItem("tg-ticks",JSON.stringify(ticks));
let who=localStorage.getItem("tg-who")||"all";
const all=[];DISHES.forEach(d=>d.steps.forEach((s,i)=>all.push({d,i,t:s[0],p:s[1],x:s[2],id:d.id+"-"+i})));
OTHERS.forEach((s,i)=>all.push({d:{id:"other",name:"Other",color:"#7d7468"},i,t:s[0],p:s[1],x:s[2],id:"other-"+i}));
all.sort((a,b)=>mins(a.t)-mins(b.t));
function state(list,idx,n){ // current = last started step of this list not yet done
  if(n==null)return"";const s=list[idx];const st=mins(s.t);const next=list.slice(idx+1).find(o=>mins(o.t)>st);
  const end=next?mins(next.t):st+30; if(n>=st&&n<end)return"cur"; if(n>=end)return"past"; return"";}
function nav(){const h=(location.hash.slice(1).split("&")[0])||"overview";
 $("#nav").innerHTML=`<a class="chip ${h==="overview"?"on":""}" href="#overview">Overview</a>`+
 DISHES.map(d=>`<a class="chip ${h===d.id?"on":""}" href="#${d.id}"><span class="dot" style="background:${d.color}"></span>${d.name}</a>`).join("");
 const on=$("#nav .on");on&&on.scrollIntoView({inline:"center",block:"nearest"});}
function stepRow(o,cls,showDish){const done=ticks[o.id];
 return `<li class="step ${cls} ${done?"done":""}" data-id="${o.id}"><div class="time">${fmt(o.t)}</div><div>
 ${showDish?`<div class="dishname" style="color:${o.d.color}">${esc(o.d.name)}</div>`:""}
 <div class="whoname">${PEOPLE[o.p]}</div><div class="txt">${esc(o.x)}</div></div>
 <button class="box" aria-label="Done" aria-pressed="${!!done}">${done?"✓":""}</button></li>`;}
function nowBox(n){if(n==null)return"";
 const cur=[];DISHES.forEach(d=>{const L=d.steps.map((s,i)=>({d,i,t:s[0],p:s[1],x:s[2],id:d.id+"-"+i}));L.forEach((o,i)=>{if(state(L,i,n)==="cur"&&!ticks[o.id])cur.push(o)})});
 const next=all.filter(o=>mins(o.t)>n&&(who==="all"||o.p===who)).slice(0,3);
 const f=cur.filter(o=>who==="all"||o.p===who);
 return `<div class="card nowbox"><h2>Now</h2>${f.length?f.map(o=>`<div class="nowline"><span class="tag" style="background:${o.d.color}">${esc(o.d.name)}</span><span><b>${PEOPLE[o.p]}:</b> ${esc(o.x)}</span></div>`).join(""):"<div>Nothing under way.</div>"}
 ${next.length?`<h2 style="margin-top:14px">Next</h2>`+next.map(o=>`<div class="nowline"><span class="who">${fmt(o.t)}</span><span><b>${PEOPLE[o.p]}</b> · ${esc(o.d.name)}: ${esc(o.x)}</span></div>`).join(""):""}</div>`;}
function overview(){const n=nowMins();
 const hours=[8,9,10,11,12,13,14,15];
 const cell=(d,h)=>d.steps.map((s,i)=>[s,i]).filter(([s])=>Math.floor(mins(s[0])/60)===h).map(([s])=>`<div class="it"><span class="t">${fmt(s[0])}</span> <span class="p">${s[1]}</span><br>${esc(s[3]||s[2])}</div>`).join("");
 const others=h=>OTHERS.filter(s=>Math.floor(mins(s[0])/60)===h).map(s=>`<div class="it"><span class="t">${fmt(s[0])}</span> <span class="p">${s[1]}</span><br>${esc(s[2].split(". ")[0].replace(/\.$/,""))}</div>`).join("");
 const grid=`<div class="grid"><table><thead><tr><th></th>${DISHES.map(d=>`<th><a href="#${d.id}" style="border-color:${d.color}">${d.name}</a></th>`).join("")}<th>Others</th></tr></thead><tbody>
 ${hours.map(h=>`<tr class="${n!=null&&Math.floor(n/60)===h?"cur":""}"><th>${fmt(h+":00").replace(":00","")}${h>=12?" pm":" am"}</th>${DISHES.map(d=>`<td>${cell(d,h)}</td>`).join("")}<td>${others(h)}</td></tr>`).join("")}
 </tbody></table></div>`;
 const people=["all","M","K","C","Mk","S"];
 const list=all.filter(o=>who==="all"||o.p===who);
 const tl=`<div class="card tl"><h2>Everyone's steps, in order</h2><div class="who-filter">${people.map(p=>`<button class="chip ${who===p?"on":""}" data-who="${p}">${p==="all"?"Everyone":PEOPLE[p]}</button>`).join("")}</div>
 <ol class="steps">${list.map(o=>{const L=o.d.id==="other"?null:o.d.steps.map((s,i)=>({t:s[0]}));const cls=L?state(L,o.i,n):"";return stepRow(o,cls,true)}).join("")}</ol></div>`;
 const where=`<div class="card"><h2>Where everything is${typeof STATUS_AT!=="undefined"?" ("+fmt(STATUS_AT)+")":""}</h2>${DISHES.filter(d=>d.status).map(d=>`<div class="nowline"><span class="tag" style="background:${d.color}">${esc(d.name)}</span><span>${esc(d.status)}</span></div>`).join("")}</div>`;
 $("#main").innerHTML=nowBox(n)+where+`<div class="card" style="padding:12px 16px"><h2 style="margin:0">The day at a glance</h2><div class="meta" style="margin-top:2px">Tap a dish for its timeline and recipe. Swipe the table sideways.</div></div>`+grid+tl+foot();}
function dish(d){const n=nowMins();const L=d.steps.map((s,i)=>({d,i,t:s[0],p:s[1],x:s[2],id:d.id+"-"+i}));
 $("#main").innerHTML=`<div class="card"><div class="hero" style="border-color:${d.color}"><h2>${d.name}</h2>
 <div class="meta">${d.where} · led by ${PEOPLE[d.lead]}</div><div class="goal">${esc(d.goal)}</div>${d.status?`<div class="status"><b>Now (${typeof STATUS_AT!=="undefined"?fmt(STATUS_AT):""}):</b> ${esc(d.status)}</div>`:""}</div></div>
 <div class="card"><h2>Timeline</h2><ol class="steps">${L.map((o,i)=>stepRow(o,state(L,i,n),false)).join("")}</ol></div>
 <div class="card"><details open><summary>What you need</summary><ul class="ing">${d.ingredients.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></details></div>
 ${d.tips&&d.tips.length?`<div class="card tips"><h2 style="color:var(--ink)">Good to know</h2>${d.tips.map(t=>`<p>${esc(t)}</p>`).join("")}</div>`:""}`+foot();}
const foot=()=>`<div class="foot">Ticks are saved on this phone only. The birds are done when the thermometer says so, not the clock.</div>`;
function render(){document.querySelectorAll("#units button").forEach(b=>b.classList.toggle("on",b.dataset.u===units));nav();const h=location.hash.slice(1).split("&")[0];const d=DISHES.find(x=>x.id===h);d?dish(d):overview();
 const c=$("#main .step.cur");}
function clock(){const d=new Date();$("#clock").textContent="now "+d.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});}
document.addEventListener("click",e=>{const b=e.target.closest(".box");if(b){const id=b.closest(".step").dataset.id;ticks[id]=!ticks[id];if(!ticks[id])delete ticks[id];save();render();return}
 const u=e.target.closest("[data-u]");if(u){units=u.dataset.u;localStorage.setItem("tg-units",units);render();return}
 const w=e.target.closest("[data-who]");if(w){who=w.dataset.who;localStorage.setItem("tg-who",who);render();}});
addEventListener("hashchange",()=>{render();scrollTo(0,0)});
clock();render();setInterval(()=>{clock();if(!document.querySelector(":focus"))render()},60000);
</script></body></html>
